name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU-safe development dependencies
        run: python -m pip install -e ".[api,dev]"
      - name: Lint
        run: ruff check .
      - name: Test without model training
        run: pytest
