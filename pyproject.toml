[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "support-ticket-triage-ml"
version = "0.1.0"
description = "Reproducible banking support-intent triage and routing"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
authors = [{name = "Arash"}]
dependencies = [
  "joblib==1.5.2",
  "matplotlib==3.10.6",
  "numpy==2.2.6",
  "pandas==2.3.3",
  "scikit-learn==1.7.2",
]

[project.optional-dependencies]
api = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
]
transformer = [
  "torch==2.8.0",
  "transformers==4.56.2",
  "accelerate==1.10.1",
]
dev = [
  "httpx==0.28.1",
  "psutil==7.0.0",
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "ruff==0.13.1",
]

[project.scripts]
support-triage = "support_ticket_triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
